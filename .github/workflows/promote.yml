name: Promote main to release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA on main to promote (leave empty for latest HEAD of main)"
        required: false
        default: ""
        type: string

concurrency:
  group: promote-gate
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  promote:
    name: "Controlled Promotion (main -> release)"
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment with Full Git History
        uses: ./.github/actions/setup-project
        with:
          fetch-depth: 0
          install-deps: false

      - name: Resolve and Validate Target Commit from main
        id: resolve-target
        run: |
          git fetch origin main release

          INPUT_SHA="${{ inputs.target_sha }}"
          if [ -z "$INPUT_SHA" ]; then
            TARGET_SHA=$(git rev-parse origin/main)
            echo "Using latest HEAD of origin/main: ${TARGET_SHA}"
          else
            TARGET_SHA=$(git rev-parse "${INPUT_SHA}")
            echo "Specified commit SHA: ${TARGET_SHA}"

            # Invariant: Commit MUST belong to branch main
            if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
              echo "::error::Commit ${TARGET_SHA} is not an ancestor of origin/main. Promotion must strictly originate from main."
              exit 1
            fi
          fi

          echo "target_sha=${TARGET_SHA}" >> $GITHUB_OUTPUT
          echo "target_short_sha=${TARGET_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Verify CI Checks for Target Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve-target.outputs.target_sha }}
        run: |
          echo "Verifying GitHub check runs for commit: ${TARGET_SHA}..."

          CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" \
            --jq '{
              total_count: .total_count,
              check_runs: [.check_runs[] | { name: .name, status: .status, conclusion: .conclusion }]
            }')

          echo "Check runs summary:"
          echo "$CHECKS_JSON" | jq .

          # Filter specifically for Main CI pipeline stages and ignore promotion itself
          CI_CHECKS=$(echo "$CHECKS_JSON" | jq '[.check_runs[] | select((.name | startswith("Stage ")) and (.name | test("Promotion|promote"; "i") | not))]')
          TOTAL_CI_CHECKS=$(echo "$CI_CHECKS" | jq 'length')

          echo "Evaluated CI check runs (count: ${TOTAL_CI_CHECKS}):"
          echo "$CI_CHECKS" | jq .

          if [ "$TOTAL_CI_CHECKS" -lt 7 ]; then
            echo "::error::Found only ${TOTAL_CI_CHECKS} Main CI check runs for commit ${TARGET_SHA} (expected at least 7 stages). The commit must complete the Main CI Pipeline before promotion."
            exit 1
          fi

          PENDING_CHECKS=$(echo "$CI_CHECKS" | jq '[.[] | select(.status != "completed")] | length')
          FAILED_CHECKS=$(echo "$CI_CHECKS" | jq '[.[] | select(.conclusion != "success" and .name != "Stage 4: Candidate Metadata")] | length')

          if [ "$PENDING_CHECKS" -gt 0 ]; then
            echo "::error::There are ${PENDING_CHECKS} pending CI stages on commit ${TARGET_SHA}. Wait for Main CI Pipeline to finish."
            exit 1
          fi

          if [ "$FAILED_CHECKS" -gt 0 ]; then
            echo "::error::There are ${FAILED_CHECKS} failed or uncompleted checks on commit ${TARGET_SHA}. Cannot promote unstable commit."
            exit 1
          fi

          echo "All ${TOTAL_CI_CHECKS} Main CI stages on commit ${TARGET_SHA} have passed successfully!"

      - name: Fast-Forward Release Branch
        env:
          TARGET_SHA: ${{ steps.resolve-target.outputs.target_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Fast-forwarding branch 'release' to validated commit ${TARGET_SHA}..."
          git push origin "${TARGET_SHA}:refs/heads/release"
          echo "Branch 'release' successfully updated to commit ${TARGET_SHA}."

      - name: Publish Promotion Summary
        env:
          TARGET_SHA: ${{ steps.resolve-target.outputs.target_sha }}
          SHORT_SHA: ${{ steps.resolve-target.outputs.target_short_sha }}
        run: |
          echo "## 🚀 Promotion to Release Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Promoted Commit SHA**: \`${TARGET_SHA}\` (\`${SHORT_SHA}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Branch**: \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Destination Branch**: \`release\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Release Branch Synchronized**: Branch \`release\` is up to date with \`main\`. You can now trigger a production release at any time via \`.github/workflows/release.yml\`." >> $GITHUB_STEP_SUMMARY
