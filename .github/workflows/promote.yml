name: Promote main to release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA from main to promote (leave empty for latest HEAD of main)"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Type 'PROMOTE' to confirm fast-forward promotion to branch release"
        required: true
        type: string

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: write

jobs:
  promote:
    name: "Controlled Promotion (main -> release)"
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation Input
        run: |
          if [ "${{ inputs.confirmation }}" != "PROMOTE" ]; then
            echo "::error::Confirmation mismatch. You must enter 'PROMOTE' to proceed with production promotion."
            exit 1
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve Target Commit SHA
        id: resolve-sha
        run: |
          INPUT_SHA="${{ inputs.target_sha }}"
          if [ -z "$INPUT_SHA" ]; then
            TARGET_SHA=$(git rev-parse HEAD)
            echo "Resolved latest HEAD of main: ${TARGET_SHA}"
          else
            TARGET_SHA=$(git rev-parse "${INPUT_SHA}")
            echo "Resolved specified target commit: ${TARGET_SHA}"
          fi

          echo "target_sha=${TARGET_SHA}" >> $GITHUB_OUTPUT
          echo "target_short_sha=${TARGET_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Verify CI Checks for Target Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
        run: |
          echo "Verifying GitHub check runs for commit: ${TARGET_SHA}..."

          CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" \
            --jq '{
              total_count: .total_count,
              check_runs: [.check_runs[] | { name: .name, status: .status, conclusion: .conclusion }]
            }')

          echo "Check runs summary:"
          echo "$CHECKS_JSON" | jq .

          # Filter specifically for Main CI pipeline stages and ignore the promotion job itself
          CI_CHECKS=$(echo "$CHECKS_JSON" | jq '[.check_runs[] | select((.name | startswith("Stage ")) and (.name | test("Promotion|promote"; "i") | not))]')
          TOTAL_CI_CHECKS=$(echo "$CI_CHECKS" | jq 'length')

          echo "Evaluated CI check runs:"
          echo "$CI_CHECKS" | jq .

          if [ "$TOTAL_CI_CHECKS" -lt 7 ]; then
            echo "::error::Found only ${TOTAL_CI_CHECKS} Main CI check runs for commit ${TARGET_SHA} (expected at least 7 stages). The commit must complete the Main CI Pipeline before promotion."
            exit 1
          fi

          PENDING_CHECKS=$(echo "$CI_CHECKS" | jq '[.[] | select(.status != "completed")] | length')
          FAILED_CHECKS=$(echo "$CI_CHECKS" | jq '[.[] | select(.conclusion != "success" and .name != "Stage 4: Candidate Metadata")] | length')

          if [ "$PENDING_CHECKS" -gt 0 ]; then
            echo "::error::There are ${PENDING_CHECKS} pending CI stages on commit ${TARGET_SHA}. Wait for Main CI Pipeline to finish."
            exit 1
          fi

          if [ "$FAILED_CHECKS" -gt 0 ]; then
            echo "::error::There are ${FAILED_CHECKS} failed or uncompleted checks on commit ${TARGET_SHA}. Cannot promote unstable commit."
            exit 1
          fi

          echo "All ${TOTAL_CI_CHECKS} Main CI stages on commit ${TARGET_SHA} have passed successfully!"

      - name: Fast-Forward Release Branch
        env:
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Fast-forwarding branch 'release' to ${TARGET_SHA}..."
          git push origin "${TARGET_SHA}:refs/heads/release"

          echo "Dispatching Production Release workflow on branch 'release'..."
          gh workflow run release.yml --ref release -f version_bump=patch || {
            echo "::notice::Workflow dispatch triggered or delegated to release branch."
          }

      - name: Publish Promotion Summary
        env:
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
          SHORT_SHA: ${{ steps.resolve-sha.outputs.target_short_sha }}
        run: |
          echo "## 🚀 Promotion to Release Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Promoted Commit SHA**: \`${TARGET_SHA}\` (\`${SHORT_SHA}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Branch**: \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Destination Branch**: \`release\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Production Deployment Pipeline Triggered**: Branch \`release\` will now automatically execute \`.github/workflows/release.yml\` to deploy to GitHub Pages." >> $GITHUB_STEP_SUMMARY
