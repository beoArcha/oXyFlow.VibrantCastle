name: Main CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: "Stage 1: Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

  lint:
    name: "Stage 1: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Lint
        run: bun run lint

  unit:
    name: "Stage 2: Unit Tests"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: bun run test:unit

  integration:
    name: "Stage 2: Integration Tests"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Integration Tests
        run: bun run test:integration

  architecture:
    name: "Stage 2: Architecture Boundary Tests"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Architecture Tests
        run: bun run test:arch

  e2e:
    name: "Stage 2: E2E Smoke Tests"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Distribution for E2E
        run: bun run build:pages
        env:
          VITE_BASE_PATH: /vibrant_castle/game/

      - name: Run E2E Smoke Tests
        run: bun run test:e2e

  build-verify:
    name: "Stage 3: Build Verification"
    needs: [unit, integration, architecture, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Assemble Production Distribution
        run: bun run build:pages
        env:
          VITE_BASE_PATH: /vibrant_castle/game/

      - name: Validate Generated Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -f dist/game/index.html || { echo "Missing dist/game/index.html"; exit 1; }
          test -f dist/.nojekyll || { echo "Missing dist/.nojekyll"; exit 1; }
          echo "All distribution artifacts verified successfully."

      - name: Generate Build Summary
        run: |
          echo "### 🏰 Build Verification Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Portal Entrypoint**: \`dist/index.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Game Client**: \`dist/game/index.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages Marker**: \`dist/.nojekyll\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  ci-summary:
    name: "Stage 4: Candidate Metadata"
    needs: [build-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute Release Candidate Identifier
        id: candidate
        run: |
          BASE_VERSION=$(bun -e 'console.log(require("./package.json").version)')
          CANDIDATE_ID="${BASE_VERSION}-dev.${{ github.run_number }}.${GITHUB_SHA:0:7}"
          echo "candidate_id=${CANDIDATE_ID}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT

      - name: Publish CI Pipeline Summary
        run: |
          echo "## ✅ Vibrant Castle — Main CI Pipeline Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Execution |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 1 (Static Analysis)** | Pass | Parallel: \`typecheck\`, \`lint\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 2 (Test Suite)** | Pass | Parallel: \`unit\`, \`integration\`, \`architecture\`, \`e2e\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 3 (Distribution Build)** | Pass | Verified \`dist/index.html\` & \`dist/game/index.html\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 4 (Candidate Metadata)** | Ready | Base \`${{ steps.candidate.outputs.base_version }}\` / Candidate \`${{ steps.candidate.outputs.candidate_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Ready for Controlled Promotion**: This commit SHA (\`${{ github.sha }}\`) is validated and ready for promotion to \`release\` via \`.github/workflows/promote.yml\`." >> $GITHUB_STEP_SUMMARY
