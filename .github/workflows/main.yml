name: 1. Main CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: "Stage 1: Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Run Typecheck
        run: bun run typecheck

  lint:
    name: "Stage 1: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Run Lint
        run: bun run lint

  unit:
    name: "Stage 2: Unit Tests & Coverage"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Run Unit Tests with Coverage
        run: bun run test:unit:coverage

      - name: Upload Unit Coverage Profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          retention-days: 1

  integration:
    name: "Stage 2: Integration Tests & Coverage"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Run Integration Tests with Coverage
        run: bun run test:integration:coverage

      - name: Upload Integration Coverage Profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/lcov.info
          retention-days: 1

  coverage-gate:
    name: "Stage 3: Coverage Quality Gate"
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Download Unit Coverage Profile
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit

      - name: Download Integration Coverage Profile
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration

      - name: Evaluate Coverage Quality Gate
        run: bun run coverage:gate

  architecture:
    name: "Stage 2: Architecture Boundary Tests"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Run Architecture Tests
        run: bun run test:arch

  e2e:
    name: "Stage 2: E2E Smoke Tests"
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Assemble Distribution for E2E
        run: bun run build:pages
        env:
          VITE_BASE_PATH: ./

      - name: Run E2E Smoke Tests
        run: bun run test:e2e

  build-verify:
    name: "Stage 4: Build Verification"
    needs: [coverage-gate, architecture, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Compile Production Game Client
        run: bun run build:game
        env:
          VITE_BASE_PATH: ./

      - name: Validate Compiled Game Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -d dist/assets || { echo "Missing dist/assets directory"; exit 1; }
          echo "Production game client build verified successfully."

      - name: Generate Build Summary
        run: |
          echo "### 🏰 Game Client Build Verification Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Entrypoint**: \`dist/index.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Assets**: \`dist/assets/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  ci-summary:
    name: "Stage 5: Candidate Metadata"
    needs: [build-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Compute Release Candidate Identifier
        id: candidate
        run: |
          BASE_VERSION=$(bun -e 'console.log(require("./package.json").version)')
          CANDIDATE_ID="${BASE_VERSION}-dev.${{ github.run_number }}.${GITHUB_SHA:0:7}"
          echo "candidate_id=${CANDIDATE_ID}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT

      - name: Publish CI Pipeline Summary
        run: |
          echo "## ✅ Vibrant Castle — Main CI Pipeline Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Execution |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 1 (Static Analysis)** | Pass | Parallel: \`typecheck\`, \`lint\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 2 (Test & Coverage Gate)** | Pass | Parallel: \`unit\` (>=60%), \`integration\` (>=40%), \`coverage-gate\` (>=80% combined), \`architecture\`, \`e2e\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 3 (Client Build)** | Pass | Verified compiled game client from \`src/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 4 (Candidate Metadata)** | Ready | Base \`${{ steps.candidate.outputs.base_version }}\` / Candidate \`${{ steps.candidate.outputs.candidate_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Ready for Controlled Promotion**: This commit SHA (\`${{ github.sha }}\`) is validated and ready for promotion to \`release\` via \`.github/workflows/promote.yml\`." >> $GITHUB_STEP_SUMMARY
