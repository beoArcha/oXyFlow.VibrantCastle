name: CI — Pull Request Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun & dependencies
        uses: ./.github/actions/setup-bun-cached
      - name: Run TypeScript typecheck
        run: bun run typecheck

  unit-coverage:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun & dependencies
        uses: ./.github/actions/setup-bun-cached
      - name: Run unit tests with LCOV coverage
        run: bun run test:unit:coverage
      - name: Upload unit coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
          retention-days: 3
          if-no-files-found: warn

  integration-coverage:
    name: Integration Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun & dependencies
        uses: ./.github/actions/setup-bun-cached
      - name: Run integration tests with LCOV coverage
        run: bun run test:integration:coverage
      - name: Upload integration coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration
          retention-days: 3
          if-no-files-found: warn

  arch-and-levels:
    name: Architecture, Levels & Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun & dependencies
        uses: ./.github/actions/setup-bun-cached
      - name: Run architecture test suite
        run: bun run test:arch
      - name: Validate all shipped locations
        run: bun scripts/validate-level.ts --all
      - name: Run script unit tests
        run: bun run test:scripts

  coverage-gate:
    name: Coverage Gate
    needs:
      - unit-coverage
      - integration-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun & dependencies
        uses: ./.github/actions/setup-bun-cached
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
        continue-on-error: true
      - name: Download integration coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration
        continue-on-error: true
      - name: Evaluate coverage gate
        run: bun run coverage:gate

  quick-build:
    name: Quick Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun & dependencies
        uses: ./.github/actions/setup-bun-cached
      - name: Build production game client
        run: bun run build:game
