name: Deploy — GitHub Pages (Release)

on:
  push:
    branches:
      - release
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: release
        type: string

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-smoke:
    name: Build Distribution & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Bun & dependencies
        uses: ./.github/actions/setup-bun-cached

      - name: Assemble GitHub Pages distribution (Wiki + /game/)
        run: bun run build:pages

      - name: Verify distribution integrity (E2E smoke)
        run: bun run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
