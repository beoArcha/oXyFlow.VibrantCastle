name: Production Release & GitHub Pages Deployment

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "SemVer bump mode (patch, minor, major, or none to keep package.json version)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - none

concurrency:
  group: release-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  preflight:
    name: "Release Preflight Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Static Typecheck
        run: bun run typecheck

      - name: Run Architecture Boundary Tests
        run: bun run test:arch

  build-and-package:
    name: "Production Build & Asset Packaging"
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Distribution
        run: bun run build:pages
        env:
          VITE_BASE_PATH: /vibrant_castle/game/

      - name: Validate Built Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -f dist/game/index.html || { echo "Missing dist/game/index.html"; exit 1; }
          test -f dist/.nojekyll || { echo "Missing dist/.nojekyll"; exit 1; }

      - name: Package Release Archive
        run: |
          cd dist
          zip -r ../vibrant-castle-web.zip .
          cd ..

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibrant-castle-web-zip
          path: vibrant-castle-web.zip
          retention-days: 14

  create-release:
    name: "GitHub Tag & Release"
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download Release Archive Artifact
        uses: actions/download-artifact@v4
        with:
          name: vibrant-castle-web-zip

      - name: Compute Release Tag
        id: tagger
        run: |
          BASE_VERSION=$(bun -e 'console.log(require("./package.json").version)')
          BUMP="${{ inputs.version_bump }}"

          if [ "$BUMP" = "minor" ]; then
            NEW_VERSION=$(bun -e "const [m,n] = '${BASE_VERSION}'.split('.'); console.log(\`\${m}.\${Number(n)+1}.0\`)")
          elif [ "$BUMP" = "major" ]; then
            NEW_VERSION=$(bun -e "const [m] = '${BASE_VERSION}'.split('.'); console.log(\`\${Number(m)+1}.0.0\`)")
          elif [ "$BUMP" = "patch" ]; then
            NEW_VERSION=$(bun -e "const [m,n,p] = '${BASE_VERSION}'.split('.'); console.log(\`\${m}.\${n}.\${Number(p)+1}\`)")
          else
            NEW_VERSION="${BASE_VERSION}"
          fi

          TAG="v${NEW_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="v${NEW_VERSION}.${{ github.run_number }}"
          fi

          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tagger.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Tagging commit with ${TAG}..."
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

          echo "Creating GitHub Release for ${TAG}..."
          gh release create "$TAG" vibrant-castle-web.zip \
            --title "Vibrant Castle ${TAG}" \
            --generate-notes

  deploy-pages:
    name: "Deploy to GitHub Pages"
    needs: [build-and-package, create-release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages Bundle
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    name: "Post-Deployment Smoke Verification"
    needs: [deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Deployment URL
        run: |
          TARGET_URL="https://beoarcha.github.io/vibrant_castle/"
          echo "Checking live portal at ${TARGET_URL}..."

          SUCCESS=false
          for attempt in $(seq 1 12); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
            echo "Attempt $attempt: HTTP response code ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            sleep 10
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "### 🌐 Live Production Verification Passed" >> $GITHUB_STEP_SUMMARY
            echo "- **Portal URL**: [https://beoarcha.github.io/vibrant_castle/](https://beoarcha.github.io/vibrant_castle/)" >> $GITHUB_STEP_SUMMARY
            echo "- **Game Client**: [https://beoarcha.github.io/vibrant_castle/game/](https://beoarcha.github.io/vibrant_castle/game/)" >> $GITHUB_STEP_SUMMARY
            echo "- **HTTP Status**: \`200 OK\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Production Deployment Submitted" >> $GITHUB_STEP_SUMMARY
            echo "Deployment was pushed to GitHub Pages. CDN edge propagation may take 1-2 minutes to return HTTP 200." >> $GITHUB_STEP_SUMMARY
          fi
