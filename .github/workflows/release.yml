name: 3. Production Game Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to release from"
        required: true
        default: "release"
        type: string
      version_bump:
        description: "SemVer bump mode (patch, minor, major, or none to keep package.json version)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - none

concurrency:
  group: release-creation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    name: "Stage 1: Preflight Sanity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Run Static Typecheck
        run: bun run typecheck

      - name: Run Architecture Boundary Tests
        run: bun run test:arch

  build-game:
    name: "Stage 2: Compile & Package Pure Game Client"
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Compile Pure Game Client from src/
        run: bun run build:game
        env:
          VITE_BASE_PATH: ./

      - name: Validate Compiled Game Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -d dist/assets || { echo "Missing dist/assets directory"; exit 1; }
          echo "Game client compiled cleanly without wiki documentation."

      - name: Package Game Release Archive
        run: |
          cd dist
          zip -r ../vibrant-castle-game.zip .
          cd ..
          echo "Packaged vibrant-castle-game.zip successfully."

      - name: Upload Game Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibrant-castle-game-zip
          path: vibrant-castle-game.zip
          retention-days: 14

  create-release:
    name: "Stage 3: GitHub Tag & Release"
    needs: [build-game]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code with Full Git History
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-project

      - name: Download Game Archive Artifact
        uses: actions/download-artifact@v4
        with:
          name: vibrant-castle-game-zip

      - name: Compute Release Tag
        id: tagger
        run: |
          BASE_VERSION=$(bun -e 'console.log(require("./package.json").version)')
          BUMP="${{ inputs.version_bump }}"

          if [ "$BUMP" = "minor" ]; then
            NEW_VERSION=$(bun -e "const [m,n] = '${BASE_VERSION}'.split('.'); console.log(\`\${m}.\${Number(n)+1}.0\`)")
          elif [ "$BUMP" = "major" ]; then
            NEW_VERSION=$(bun -e "const [m] = '${BASE_VERSION}'.split('.'); console.log(\`\${Number(m)+1}.0.0\`)")
          elif [ "$BUMP" = "patch" ]; then
            NEW_VERSION=$(bun -e "const [m,n,p] = '${BASE_VERSION}'.split('.'); console.log(\`\${m}.\${n}.\${Number(p)+1}\`)")
          else
            NEW_VERSION="${BASE_VERSION}"
          fi

          TAG="v${NEW_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="v${NEW_VERSION}.${{ github.run_number }}"
          fi

          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Git Tag and Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tagger.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Tagging commit with ${TAG}..."
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

          echo "Creating GitHub Release for ${TAG} with pure game asset..."
          gh release create "$TAG" vibrant-castle-game.zip \
            --title "Vibrant Castle ${TAG}" \
            --generate-notes

      - name: Publish Release Summary
        env:
          TAG: ${{ steps.tagger.outputs.release_tag }}
        run: |
          echo "## 📦 Production Game Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Ref**: \`${{ inputs.target_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`vibrant-castle-game.zip\` (Pure Game Client from \`src/\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Documentation & Pages Deployment**: The documentation pipeline (\`.github/workflows/deploy-pages.yml\`) will automatically embed this game release into the wiki and deploy to GitHub Pages." >> $GITHUB_STEP_SUMMARY
