name: "Setup Vibrant Castle Environment"
description: "Configures Bun runtime and installs dependencies for Vibrant Castle"

inputs:
  bun-version:
    description: "Bun version to install."
    required: false
    default: "latest"
  install-deps:
    description: "Whether to install dependencies with bun install --frozen-lockfile."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Bun Runtime
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install Project Dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      run: bun install --frozen-lockfile
